[tool.poetry]
name = "subspaceclustering"
version = "0.1.0"
description = ""
authors = ["Johanna Hillebrand <Johanna.Hillebrand@hhu.de>"
]
packages = [
    { include = "src" }]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
tqdm = "^4.67.0"
loguru = "^0.7.2"
xarray = "^2025.1.2"
netcdf4 = "^1.7.2"
scipy = "^1.14.1"
matplotlib = "^3.9.2"
cartopy = "^0.24.1"
geopandas = "^1.0.1"
joblib = "^1.4.2"
haversine = "^2.9.0"
tqdm-joblib = "^0.0.4"
numpy = "^2.2.3"
pydantic-core = "^2.29.0"
pydantic = "^2.10.6"
dill = "^0.3.9"
scikit-learn = "^1.6.1"
igraph = "^0.11.8"
notebook = "^7.4.1"
seaborn = "^0.13.2"
networkx = "^3.4.2"
rasterio = "^1.4.3"
pydantic-settings = "^2.10.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
package-mode = false

[tool.poetry.scripts]
subspace-clustering = "src.main:main"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["test"]
filterwarnings = [
    # netCDF4's compiled extension self-reports a NumPy C-ABI size mismatch (dtype struct grew in
    # NumPy 2.x). It is benign here (I/O works); the real fix is aligning the netCDF4/NumPy build,
    # e.g. by running on the declared Python 3.12. Scoped to this exact message only.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
