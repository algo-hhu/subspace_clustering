[tool.poetry]
name = "subspaceclustering"
version = "0.1.1"
description = ""
authors = ["anonymous"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
tqdm = "^4.70.1"
loguru = "^0.7.3"
xarray = "^2026.9.0"
netcdf4 = "^1.7.5"
scipy = "^1.18.1"
matplotlib = "^3.11.2"
cartopy = "^0.26.0"
geopandas = "^1.2.0"
joblib = "^1.6.0"
haversine = "^2.9.0"
tqdm-joblib = "^0.0.5"
numpy = "^2.5.4"
pydantic-core = "^2.50.0"
pydantic = "^2.14.2"
dill = "^0.4.1"
scikit-learn = "^1.9.1"
igraph = "^1.0.0"
notebook = "^7.6.4"
seaborn = "^0.13.2"
networkx = "^3.5"
rasterio = "^1.5.2"
pydantic-settings = "^2.16.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
package-mode = false

[tool.poetry.scripts]
subspace-clustering = "src.main:main"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["test"]
filterwarnings = [
    # netCDF4's compiled extension self-reports a NumPy C-ABI size mismatch (dtype struct grew in
    # NumPy 2.x). It is benign here (I/O works); the real fix is aligning the netCDF4/NumPy build,
    # e.g. by running on the declared Python 3.12. Scoped to this exact message only.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
